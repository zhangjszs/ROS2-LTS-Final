name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-lint:
    runs-on: ubuntu-24.04
    env:
      ROS_DISTRO: jazzy
      # Keep ccache inside the workspace so actions/cache can persist it.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools (ccache, mold, clang-format, cppcheck)
        run: |
          sudo apt-get update
          # mold: colcon_defaults.yaml forces -DCMAKE_LINKER_TYPE=MOLD
          # clang-format/cppcheck: consumed by scripts/lint_cpp.sh
          sudo apt-get install -y ccache mold clang-format cppcheck

      - name: Prepare ROS 2 ${{ env.ROS_DISTRO }}
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ env.ROS_DISTRO }}

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ env.ROS_DISTRO }}-${{ hashFiles('colcon_defaults.yaml', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.ROS_DISTRO }}-

      - name: Install dependencies (rosdep)
        run: |
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          sudo rosdep init 2>/dev/null || true
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y

      - name: Lint (clang-format + cppcheck, no build)
        run: bash scripts/lint_cpp.sh

      - name: Build (Release, C++20, mold + ccache, tests on)
        run: |
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          # --cmake-args below re-states the colcon_defaults.yaml cmake-args
          # (a CLI --cmake-args list replaces the file's list) plus BUILD_TESTING=ON.
          colcon build --symlink-install \
            --cmake-args \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_STANDARD=20 \
              -DCMAKE_LINKER_TYPE=MOLD \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DBUILD_TESTING=ON

      - name: Test
        run: |
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          source install/setup.bash
          colcon test --event-handlers console_cohesion+

      - name: Enforce test results (fail on any failure)
        run: |
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          source install/setup.bash
          colcon test-result --verbose

      - name: Show ccache stats
        if: always()
        run: ccache -s || true

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/*/test_results/**
            log/**
          if-no-files-found: ignore
          retention-days: 7
